<script>
    const vertexShader = `
        varying vec2 v_texCoord;
        void main() {
            v_texCoord = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;

    const fragmentShader = `
precision highp float;

uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

varying vec2 v_texCoord;

// Simple noise function
float hash(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
}

void main() {
    vec2 uv = v_texCoord;
    
    // Create organic movement
    float n = noise(uv * 3.0 + u_time * 0.1);
    n += noise(uv * 6.0 - u_time * 0.15) * 0.5;
    
    // Matte Black base (#1A1A1A)
    vec3 black = vec3(0.1, 0.1, 0.1);
    // Rose Gold accent (#B76E79)
    vec3 roseGold = vec3(0.718, 0.431, 0.475);
    
    // Create a flowing "liquid silk" or "velvet" mask
    float mask = smoothstep(0.3, 0.7, n);
    
    // Add some depth and subtle highlights
    float highlight = pow(n, 4.0) * 0.3;
    
    // Blend colors
    vec3 finalColor = mix(black, roseGold * 0.2, mask);
    finalColor += roseGold * highlight * 0.5;
    
    // Vignette for focus
    float dist = distance(uv, vec2(0.5));
    finalColor *= smoothstep(0.8, 0.2, dist);
    
    gl_FragColor = vec4(finalColor, 1.0);
}
    `;

    const container = document.getElementById('shader-container');
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const uniforms = {
        u_time: { value: 0.0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        u_mouse: { value: new THREE.Vector2(0, 0) }
    };

    const geometry = new THREE.PlaneGeometry(2, 2);
    const material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    });

    document.addEventListener('mousemove', (e) => {
        uniforms.u_mouse.value.set(e.clientX, window.innerHeight - e.clientY);
    });

    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        uniforms.u_time.value = clock.getElapsedTime();
        renderer.render(scene, camera);
    }
    animate();
</script>
